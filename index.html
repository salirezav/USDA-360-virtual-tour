<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USDA Lab — 360 Virtual Tour</title>
  <script>
(function () {
  // GitHub Pages project URLs are often opened without a trailing slash (e.g.
  // /USDA-360-virtual-tour). A relative "marzipano-export/" then wrongly resolves
  // to /marzipano-export/ on the hostname. Build an absolute path from pathname.
  var path = location.pathname;
  var segments = path.split('/').filter(Boolean);
  var last = segments[segments.length - 1];
  if (last && last.indexOf('.') !== -1) segments.pop();
  var base = segments.length ? '/' + segments.join('/') + '/' : '/';
  var target = base + 'marzipano-export/';
  location.replace(target);
})();
  </script>
</head>
<body>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 1.5rem;">
      Enable JavaScript to load the tour. On GitHub Pages, open the site URL with a trailing slash, then go to <code>marzipano-export/</code>.
    </p>
  </noscript>
  <p style="font-family: system-ui, sans-serif; padding: 1.5rem;">Loading the virtual tour…</p>
</body>
</html>
